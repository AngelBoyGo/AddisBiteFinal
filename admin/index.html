<body>
  <div id="root"></div>

  <!--
    Data layer. These are plain classic scripts, loaded in dependency order and
    BEFORE the app module (module scripts are deferred, so they run last):
      data.js   -> window.AB       mock catalogue (sub-cities, restaurants)
      ab-bus.js -> window.ABBus    cross-tab event bus; init('admin') below
      ab-geo.js -> window.ABGeo    geo helpers
      ab-api.js -> window.ABApi    the ONE shared store + state machine
      ab-seed.js-> window.ABSeed   seeds the store on first run
    ABApi.boot() then populates the store, which every admin screen reads
    through `app.live(...)` / `app.balance(...)`. No network calls anywhere.
  -->
  <script src="/admin/vendor/data.js"></script>
  <script src="/admin/vendor/ab-bus.js"></script>
  <script>window.ABBus && window.ABBus.init('admin');</script>
  <script src="/admin/vendor/ab-geo.js"></script>
  <script src="/admin/vendor/ab-api.js"></script>
  <script src="/admin/vendor/ab-seed.js"></script>
  <script>window.ABApi && window.ABApi.boot();</script>

</body>
</html>
