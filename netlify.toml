[build]
  publish = "site"
  command = "node tools/build-pages.mjs"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Every form on this site posts to the real Addis Bites API (see
# site/assets/js/ab-api.js). There are no Netlify Forms on this site any more:
# a Netlify Form only files a submission in a dashboard nobody reads, whereas
# real accounts must be created by the API.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    # connect-src MUST list the API origin or the browser blocks every signup
    # call before it leaves the page (and it looks identical to a CORS failure).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.orderaddisbites.com https://api-orderaddisbites.onrender.com; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ===========================================================================
#  Route mirrors.
#  These reproduce the EXACT paths the live site already uses, so no printed
#  URL, QR code, Telegram link or bookmark breaks at cutover. Verified against
#  the live deployment's route list.
# ===========================================================================

# --- customer ---
[[redirects]]
  from = "/login"
  to = "/customer-signin.html"
  status = 301

[[redirects]]
  from = "/signup"
  to = "/customer-signup.html"
  status = 301

[[redirects]]
  from = "/signin"
  to = "/customer-signin.html"
  status = 301

